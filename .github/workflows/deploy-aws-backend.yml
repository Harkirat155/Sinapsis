name: Deploy Backends to AWS EC2

on:
  push:
    branches: [main]
    paths:
      - "synapse-core/**"
      - "synapse-intent/**"
      - "synapse-rapid/**"
      - "synapse-feedback/**"
      - "docker-compose.aws.yml"
      - ".github/workflows/deploy-aws-backend.yml"
  workflow_dispatch:

concurrency:
  group: aws-backend-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Intent service
        run: |
          cd synapse-intent
          npm ci
          npm run build

      - name: Build Rapid service
        run: |
          cd synapse-rapid
          npm ci
          npm run build

      - name: Validate Python backends syntax
        run: |
          python -m py_compile synapse-core/api.py synapse-feedback/api.py synapse-feedback/learning_engine.py

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to AWS EC2 via SSM
        id: ssm-deploy
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          DEPLOY_PATH: ${{ secrets.AWS_EC2_DEPLOY_PATH }}
          REPO_URL: https://github.com/Harkirat155/Sinapsis.git
        run: |
          set -euo pipefail

          if [ -z "${INSTANCE_ID:-}" ]; then
            echo "AWS_EC2_INSTANCE_ID secret is required."
            exit 1
          fi

          if [ -z "${DEPLOY_PATH:-}" ]; then
            DEPLOY_PATH="$HOME/sinapsis"
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Sinapsis backend services" \
            --parameters "commands=[
              \"set -e\",
              \"DEPLOY_PATH='$DEPLOY_PATH'\",
              \"export DEBIAN_FRONTEND=noninteractive\",
              \"if ! command -v git >/dev/null 2>&1; then apt-get update && apt-get install -y git; fi\",
              \"if ! command -v docker >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; systemctl enable docker; systemctl start docker; fi\",
              \"if ! command -v docker-compose >/dev/null 2>&1; then apt-get update && apt-get install -y docker-compose; fi\",
              \"if [ ! -d \\\"\\$DEPLOY_PATH/.git\\\" ]; then git clone '$REPO_URL' \\\"\\$DEPLOY_PATH\\\"; fi\",
              \"cd \\\"\\$DEPLOY_PATH\\\"\",
              \"git fetch origin main\",
              \"git reset --hard origin/main\",
              \"docker-compose -f docker-compose.aws.yml up -d --build --remove-orphans\",
              \"docker image prune -f\",
              \"docker-compose -f docker-compose.aws.yml ps\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "CommandId=$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Show SSM command output
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm-deploy.outputs.command_id }}
        run: |
          for _ in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
            --output json

      - name: Fail if SSM command failed
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm-deploy.outputs.command_id }}
        run: |
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "SSM deployment failed with status: $STATUS"
            exit 1
          fi
